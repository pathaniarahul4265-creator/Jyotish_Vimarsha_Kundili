<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <!-- Deep Cosmic Nebula Background Gradient -->
    <radialGradient id="spaceBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0b162c" />
      <stop offset="35%" stop-color="#070d1a" />
      <stop offset="70%" stop-color="#040810" />
      <stop offset="100%" stop-color="#020408" />
    </radialGradient>

    <!-- Glowing Nebula Cloud Gradient -->
    <radialGradient id="nebulaGlow" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="rgba(127, 197, 192, 0.28)" />
      <stop offset="45%" stop-color="rgba(63, 100, 150, 0.18)" />
      <stop offset="80%" stop-color="rgba(30, 45, 85, 0.08)" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>

    <!-- Central Radiant Lotus Light Gradient -->
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fff4d1" />
      <stop offset="55%" stop-color="#f2d792" />
      <stop offset="80%" stop-color="#c99738" />
      <stop offset="100%" stop-color="transparent" />
    </radialGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff7e6" />
      <stop offset="25%" stop-color="#f5dc9e" />
      <stop offset="50%" stop-color="#dfad52" />
      <stop offset="75%" stop-color="#c48a28" />
      <stop offset="100%" stop-color="#8a5a12" />
    </linearGradient>

    <!-- Soft Silver Metallic Gradient -->
    <linearGradient id="silverMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e0e8f0" />
      <stop offset="75%" stop-color="#9bb3c7" />
      <stop offset="100%" stop-color="#60768a" />
    </linearGradient>

    <!-- Glowing Star Filter -->
    <filter id="starGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="intenseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Cosmic Background -->
  <rect width="800" height="800" fill="url(#spaceBg)" />
  <circle cx="400" cy="400" r="380" fill="url(#nebulaGlow)" />

  <!-- Stars Background -->
  <g fill="#ffffff" opacity="0.75">
    <circle cx="120" cy="140" r="1" />
    <circle cx="680" cy="160" r="1.5" />
    <circle cx="140" cy="620" r="1.2" />
    <circle cx="690" cy="650" r="1.8" />
    <circle cx="250" cy="90" r="1" />
    <circle cx="560" cy="100" r="1.4" />
    <circle cx="90" cy="380" r="1.2" />
    <circle cx="710" cy="410" r="1.6" />
    <circle cx="380" cy="50" r="2" filter="url(#starGlow)" />
    <circle cx="400" cy="750" r="2.2" filter="url(#starGlow)" />
    <circle cx="50" cy="400" r="1.5" />
    <circle cx="750" cy="400" r="1.5" />
    <circle cx="280" cy="720" r="1.1" />
    <circle cx="540" cy="710" r="1.3" />
  </g>

  <!-- Top North Star & Axis Rays -->
  <g stroke="url(#goldMetallic)" stroke-width="0.8" opacity="0.6">
    <line x1="400" y1="20" x2="400" y2="780" stroke-dasharray="4,6" />
    <line x1="20" y1="400" x2="780" y2="400" stroke-dasharray="4,6" />
    <line x1="130" y1="130" x2="670" y2="670" stroke-dasharray="3,7" opacity="0.4" />
    <line x1="130" y1="670" x2="670" y2="130" stroke-dasharray="3,7" opacity="0.4" />
  </g>

  <!-- Top Star Radiance -->
  <g transform="translate(400, 45)" filter="url(#intenseGlow)">
    <polygon points="0,-18 4,-4 18,0 4,4 0,18 -4,4 -18,0 -4,-4" fill="url(#goldMetallic)" />
    <circle cx="0" cy="0" r="3" fill="#ffffff" />
  </g>
  <g transform="translate(400, 755)" filter="url(#intenseGlow)">
    <polygon points="0,-14 3,-3 14,0 3,3 0,14 -3,3 -14,0 -3,-3" fill="url(#silverMetallic)" />
    <circle cx="0" cy="0" r="2.5" fill="#ffffff" />
  </g>

  <!-- Outer Sacred Geometry Rings -->
  <circle cx="400" cy="400" r="365" fill="none" stroke="url(#goldMetallic)" stroke-width="1.2" stroke-dasharray="4,4" opacity="0.75" />
  <circle cx="400" cy="400" r="350" fill="none" stroke="url(#goldMetallic)" stroke-width="1.8" />
  <circle cx="400" cy="400" r="338" fill="none" stroke="url(#silverMetallic)" stroke-width="0.8" opacity="0.6" />
  
  <!-- Outer Star Nodes on Rim (24 Points) -->
  <g fill="url(#goldMetallic)">
    <!-- 12 Main Nodes -->
    <circle cx="400" cy="50" r="3.5" />
    <circle cx="575" cy="97" r="3" />
    <circle cx="703" cy="225" r="3" />
    <circle cx="750" cy="400" r="3.5" />
    <circle cx="703" cy="575" r="3" />
    <circle cx="575" cy="703" r="3" />
    <circle cx="400" cy="750" r="3.5" />
    <circle cx="225" cy="703" r="3" />
    <circle cx="97" cy="575" r="3" />
    <circle cx="50" cy="400" r="3.5" />
    <circle cx="97" cy="225" r="3" />
    <circle cx="225" cy="97" r="3" />
  </g>

  <!-- Sacred Geometric Interlocking Polygons / Mandala Weave -->
  <g fill="none" stroke="url(#goldMetallic)" stroke-width="0.75" opacity="0.55">
    <!-- 12-pointed Star Rays -->
    <circle cx="400" cy="400" r="230" stroke="url(#goldMetallic)" stroke-width="1.2" />
    <circle cx="400" cy="400" r="160" stroke="url(#silverMetallic)" stroke-width="0.9" stroke-dasharray="3,3" />

    <!-- Radiant Spokes from Center to Zodiac Centers -->
    <line x1="400" y1="400" x2="400" y2="120" stroke-width="1.2" />
    <line x1="400" y1="400" x2="540" y2="158" stroke-width="1.2" />
    <line x1="400" y1="400" x2="642" y2="260" stroke-width="1.2" />
    <line x1="400" y1="400" x2="680" y2="400" stroke-width="1.2" />
    <line x1="400" y1="400" x2="642" y2="540" stroke-width="1.2" />
    <line x1="400" y1="400" x2="540" y2="642" stroke-width="1.2" />
    <line x1="400" y1="400" x2="400" y2="680" stroke-width="1.2" />
    <line x1="400" y1="400" x2="260" y2="642" stroke-width="1.2" />
    <line x1="400" y1="400" x2="158" y2="540" stroke-width="1.2" />
    <line x1="400" y1="400" x2="120" y2="400" stroke-width="1.2" />
    <line x1="400" y1="400" x2="158" y2="260" stroke-width="1.2" />
    <line x1="400" y1="400" x2="260" y2="158" stroke-width="1.2" />
  </g>

  <!-- ==================== 12 ZODIAC MEDALLIONS & EMBLEMS ==================== -->
  
  <!-- Helper macro: Medallion Base Circles r=280 from center -->
  <!-- 1. ARIES (Mesha) - Top (0° / 12 o'clock) -->
  <g transform="translate(400, 120)">
    <circle cx="0" cy="0" r="48" fill="#08101d" stroke="url(#goldMetallic)" stroke-width="2" filter="url(#starGlow)" />
    <circle cx="0" cy="0" r="42" fill="none" stroke="url(#silverMetallic)" stroke-width="0.8" stroke-dasharray="2,3" />
    <!-- Aries Ram Icon Detailed Vector -->
    <path d="M-18,-10 C-26,-24 -6,-28 -2,-16 C0,-10 -1,-2 -1,18 M18,-10 C26,-24 6,-28 2,-16 C0,-10 1,-2 1,18 M-8,6 C-3,14 3,14 8,6 M-14,-2 C-8,-8 8,-8 14,-2" fill="none" stroke="url(#goldMetallic)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Ram Horns Swirls -->
    <path d="M-18,-10 C-22,-6 -22,0 -16,4 M18,-10 C22,-6 22,0 16,4" fill="none" stroke="url(#goldMetallic)" stroke-width="1.8" />
    <text x="0" y="34" font-family="'Cinzel', serif" font-size="12" font-weight="700" fill="url(#silverMetallic)" text-anchor="middle">♈</text>
  </g>

  <!-- 2. TAURUS (Vrishabha) - 30° (~2 o'clock) x=540, y=158 -->
  <g transform="translate(540, 158)">
    <circle cx="0" cy="0" r="48" fill="#08101d" stroke="url(#goldMetallic)" stroke-width="2" filter="url(#starGlow)" />
    <circle cx="0" cy="0" r="42" fill="none" stroke="url(#silverMetallic)" stroke-width="0.8" stroke-dasharray="2,3" />
    <!-- Taurus Bull Horns & Head -->
    <path d="M-20,-18 C-24,-4 -8,4 0,4 C8,4 24,-4 20,-18" fill="none" stroke="url(#goldMetallic)" stroke-width="2.6" stroke-linecap="round" />
    <circle cx="0" cy="12" r="14" fill="none" stroke="url(#goldMetallic)" stroke-width="2.6" />
    <path d="M-6,10 L6,10 M0,6 L0,16" stroke="url(#silverMetallic)" stroke-width="1.2" />
    <text x="0" y="34" font-family="'Cinzel', serif" font-size="12" font-weight="700" fill="url(#silverMetallic)" text-anchor="middle">♉</text>
  </g>

  <!-- 3. GEMINI (Mithuna) - 60° (~3 o'clock) x=642, y=260 -->
  <g transform="translate(642, 260)">
    <circle cx="0" cy="0" r="48" fill="#08101d" stroke="url(#goldMetallic)" stroke-width="2" filter="url(#starGlow)" />
    <circle cx="0" cy="0" r="42" fill="none" stroke="url(#silverMetallic)" stroke-width="0.8" stroke-dasharray="2,3" />
    <!-- Gemini Twins Roman II with flourishes -->
    <path d="M-16,-14 C-4,-10 4,-10 16,-14 M-16,16 C-4,12 4,12 16,16 M-8,-12 L-8,14 M8,-12 L8,14" fill="none" stroke="url(#goldMetallic)" stroke-width="2.6" stroke-linecap="round" />
    <circle cx="-8" cy="-1" r="3" fill="url(#goldMetallic)" />
    <circle cx="8" cy="-1" r="3" fill="url(#goldMetallic)" />
    <text x="0" y="34" font-family="'Cinzel', serif" font-size="12" font-weight="700" fill="url(#silverMetallic)" text-anchor="middle">♊</text>
  </g>

  <!-- 4. CANCER (Karka) - 90° (East/Right 3 o'clock) x=680, y=400 -->
  <g transform="translate(680, 400)">
    <circle cx="0" cy="0" r="48" fill="#08101d" stroke="url(#goldMetallic)" stroke-width="2" filter="url(#starGlow)" />
    <circle cx="0" cy="0" r="42" fill="none" stroke="url(#silverMetallic)" stroke-width="0.8" stroke-dasharray="2,3" />
    <!-- Cancer Crab Claws & 69 Glyph -->
    <circle cx="-10" cy="-6" r="7" fill="none" stroke="url(#goldMetallic)" stroke-width="2.2" />
    <path d="M-10,-13 C4,-13 18,-4 18,2" fill="none" stroke="url(#goldMetallic)" stroke-width="2.4" stroke-linecap="round" />
    <circle cx="10" cy="6" r="7" fill="none" stroke="url(#goldMetallic)" stroke-width="2.2" />
    <path d="M10,13 C-4,13 -18,4 -18,-2" fill="none" stroke="url(#goldMetallic)" stroke-width="2.4" stroke-linecap="round" />
    <text x="0" y="34" font-family="'Cinzel', serif" font-size="12" font-weight="700" fill="url(#silverMetallic)" text-anchor="middle">♋</text>
  </g>

  <!-- 5. LEO (Simha) - 120° x=642, y=540 -->
  <g transform="translate(642, 540)">
    <circle cx="0" cy="0" r="48" fill="#08101d" stroke="url(#goldMetallic)" stroke-width="2" filter="url(#starGlow)" />
    <circle cx="0" cy="0" r="42" fill="none" stroke="url(#silverMetallic)" stroke-width="0.8" stroke-dasharray="2,3" />
    <!-- Leo Lion Mane & Tail Glyph -->
    <circle cx="-12" cy="8" r="7" fill="none" stroke="url(#goldMetallic)" stroke-width="2.4" />
    <path d="M-6,4 C-4,-14 12,-16 12,-2 C12,12 24,14 20,4" fill="none" stroke="url(#goldMetallic)" stroke-width="2.6" stroke-linecap="round" />
    <text x="0" y="34" font-family="'Cinzel', serif" font-size="12" font-weight="700" fill="url(#silverMetallic)" text-anchor="middle">♌</text>
  </g>

  <!-- 6. VIRGO (Kanya) - 150° x=540, y=642 -->
  <g transform="translate(540, 642)">
    <circle cx="0" cy="0" r="48" fill="#08101d" stroke="url(#goldMetallic)" stroke-width="2" filter="url(#starGlow)" />
    <circle cx="0" cy="0" r="42" fill="none" stroke="url(#silverMetallic)" stroke-width="0.8" stroke-dasharray="2,3" />
    <!-- Virgo Maiden / M Glyph with loop and wheat grain -->
    <path d="M-18,12 L-18,-10 C-18,-16 -10,-16 -10,-8 L-10,10 C-10,-16 -2,-16 -2,-8 L-2,12 C-2,-16 6,-16 6,-8 L6,14 C6,18 2,22 -4,18 C-8,14 -2,8 14,8" fill="none" stroke="url(#goldMetallic)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="0" y="34" font-family="'Cinzel', serif" font-size="12" font-weight="700" fill="url(#silverMetallic)" text-anchor="middle">♍</text>
  </g>

  <!-- 7. LIBRA (Tula) - 180° Bottom (6 o'clock) x=400, y=680 -->
  <g transform="translate(400, 680)">
    <circle cx="0" cy="0" r="48" fill="#08101d" stroke="url(#goldMetallic)" stroke-width="2" filter="url(#starGlow)" />
    <circle cx="0" cy="0" r="42" fill="none" stroke="url(#silverMetallic)" stroke-width="0.8" stroke-dasharray="2,3" />
    <!-- Libra Scales of Justice -->
    <line x1="-18" y1="12" x2="18" y2="12" stroke="url(#goldMetallic)" stroke-width="2.6" stroke-linecap="round" />
    <path d="M-18,-2 L-6,-2 C-6,-12 6,-12 6,-2 L18,-2" fill="none" stroke="url(#goldMetallic)" stroke-width="2.6" stroke-linecap="round" />
    <text x="0" y="34" font-family="'Cinzel', serif" font-size="12" font-weight="700" fill="url(#silverMetallic)" text-anchor="middle">♎</text>
  </g>

  <!-- 8. SCORPIO (Vrischika) - 210° x=260, y=642 -->
  <g transform="translate(260, 642)">
    <circle cx="0" cy="0" r="48" fill="#08101d" stroke="url(#goldMetallic)" stroke-width="2" filter="url(#starGlow)" />
    <circle cx="0" cy="0" r="42" fill="none" stroke="url(#silverMetallic)" stroke-width="0.8" stroke-dasharray="2,3" />
    <!-- Scorpio Scorpion Tail & Arrow -->
    <path d="M-18,12 L-18,-10 C-18,-16 -10,-16 -10,-8 L-10,10 C-10,-16 -2,-16 -2,-8 L-2,12 C-2,-16 6,-16 6,-8 L6,14 C6,18 12,18 16,14 L20,10 M14,10 L20,10 L20,16" fill="none" stroke="url(#goldMetallic)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="0" y="34" font-family="'Cinzel', serif" font-size="12" font-weight="700" fill="url(#silverMetallic)" text-anchor="middle">♏</text>
  </g>

  <!-- 9. SAGITTARIUS (Dhanu) - 240° x=158, y=540 -->
  <g transform="translate(158, 540)">
    <circle cx="0" cy="0" r="48" fill="#08101d" stroke="url(#goldMetallic)" stroke-width="2" filter="url(#starGlow)" />
    <circle cx="0" cy="0" r="42" fill="none" stroke="url(#silverMetallic)" stroke-width="0.8" stroke-dasharray="2,3" />
    <!-- Sagittarius Archer Arrow & Bow Cross -->
    <line x1="-16" y1="16" x2="16" y2="-16" stroke="url(#goldMetallic)" stroke-width="2.6" stroke-linecap="round" />
    <polyline points="4,-16 16,-16 16,-4" fill="none" stroke="url(#goldMetallic)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
    <line x1="-6" y1="-2" x2="2" y2="6" stroke="url(#goldMetallic)" stroke-width="2.6" stroke-linecap="round" />
    <text x="0" y="34" font-family="'Cinzel', serif" font-size="12" font-weight="700" fill="url(#silverMetallic)" text-anchor="middle">♐</text>
  </g>

  <!-- 10. CAPRICORN (Makara) - 270° (West/Left 9 o'clock) x=120, y=400 -->
  <g transform="translate(120, 400)">
    <circle cx="0" cy="0" r="48" fill="#08101d" stroke="url(#goldMetallic)" stroke-width="2" filter="url(#starGlow)" />
    <circle cx="0" cy="0" r="42" fill="none" stroke="url(#silverMetallic)" stroke-width="0.8" stroke-dasharray="2,3" />
    <!-- Capricorn Sea-Goat Horns and Fish Loop -->
    <path d="M-18,-6 L-10,-14 L-2,8 C2,16 10,14 12,6 C14,-2 6,-6 4,6 C2,18 10,22 18,16" fill="none" stroke="url(#goldMetallic)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
    <text x="0" y="34" font-family="'Cinzel', serif" font-size="12" font-weight="700" fill="url(#silverMetallic)" text-anchor="middle">♑</text>
  </g>

  <!-- 11. AQUARIUS (Kumbha) - 300° x=158, y=260 -->
  <g transform="translate(158, 260)">
    <circle cx="0" cy="0" r="48" fill="#08101d" stroke="url(#goldMetallic)" stroke-width="2" filter="url(#starGlow)" />
    <circle cx="0" cy="0" r="42" fill="none" stroke="url(#silverMetallic)" stroke-width="0.8" stroke-dasharray="2,3" />
    <!-- Aquarius Dual Cosmic Waves -->
    <path d="M-18,-6 L-10,-12 L-2,-6 L6,-12 L14,-6 L18,-9" fill="none" stroke="url(#goldMetallic)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M-18,6 L-10,0 L-2,6 L6,0 L14,6 L18,3" fill="none" stroke="url(#goldMetallic)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
    <text x="0" y="34" font-family="'Cinzel', serif" font-size="12" font-weight="700" fill="url(#silverMetallic)" text-anchor="middle">♒</text>
  </g>

  <!-- 12. PISCES (Meena) - 330° x=260, y=158 -->
  <g transform="translate(260, 158)">
    <circle cx="0" cy="0" r="48" fill="#08101d" stroke="url(#goldMetallic)" stroke-width="2" filter="url(#starGlow)" />
    <circle cx="0" cy="0" r="42" fill="none" stroke="url(#silverMetallic)" stroke-width="0.8" stroke-dasharray="2,3" />
    <!-- Pisces Dual Fish Joined by Silver Cord -->
    <path d="M-12,-16 C-4,-6 -4,6 -12,16 M12,-16 C4,-6 4,6 12,16" fill="none" stroke="url(#goldMetallic)" stroke-width="2.6" stroke-linecap="round" />
    <line x1="-16" y1="0" x2="16" y2="0" stroke="url(#goldMetallic)" stroke-width="2.4" stroke-linecap="round" />
    <text x="0" y="34" font-family="'Cinzel', serif" font-size="12" font-weight="700" fill="url(#silverMetallic)" text-anchor="middle">♓</text>
  </g>

  <!-- ==================== CENTRAL SACRED LOTUS MANDALA ==================== -->
  <g transform="translate(400, 400)">
    <!-- Radial Sun Glow Backdrop -->
    <circle cx="0" cy="0" r="110" fill="url(#sunGlow)" opacity="0.35" filter="url(#intenseGlow)" />

    <!-- 16-Petal Golden Lotus Flower Geometry -->
    <!-- Outer 8 Petals -->
    <g fill="none" stroke="url(#goldMetallic)" stroke-width="1.2">
      <path d="M0,0 C-18,-45 0,-95 0,-105 C0,-95 18,-45 0,0" fill="rgba(242, 215, 146, 0.08)" />
      <path d="M0,0 C-18,-45 0,-95 0,-105 C0,-95 18,-45 0,0" transform="rotate(45)" fill="rgba(242, 215, 146, 0.08)" />
      <path d="M0,0 C-18,-45 0,-95 0,-105 C0,-95 18,-45 0,0" transform="rotate(90)" fill="rgba(242, 215, 146, 0.08)" />
      <path d="M0,0 C-18,-45 0,-95 0,-105 C0,-95 18,-45 0,0" transform="rotate(135)" fill="rgba(242, 215, 146, 0.08)" />
      <path d="M0,0 C-18,-45 0,-95 0,-105 C0,-95 18,-45 0,0" transform="rotate(180)" fill="rgba(242, 215, 146, 0.08)" />
      <path d="M0,0 C-18,-45 0,-95 0,-105 C0,-95 18,-45 0,0" transform="rotate(225)" fill="rgba(242, 215, 146, 0.08)" />
      <path d="M0,0 C-18,-45 0,-95 0,-105 C0,-95 18,-45 0,0" transform="rotate(270)" fill="rgba(242, 215, 146, 0.08)" />
      <path d="M0,0 C-18,-45 0,-95 0,-105 C0,-95 18,-45 0,0" transform="rotate(315)" fill="rgba(242, 215, 146, 0.08)" />
    </g>

    <!-- Inner 8 Staggered Lotus Petals (22.5° offset) -->
    <g fill="none" stroke="url(#silverMetallic)" stroke-width="1">
      <path d="M0,0 C-14,-32 0,-70 0,-78 C0,-70 14,-32 0,0" transform="rotate(22.5)" fill="rgba(216, 160, 76, 0.12)" />
      <path d="M0,0 C-14,-32 0,-70 0,-78 C0,-70 14,-32 0,0" transform="rotate(67.5)" fill="rgba(216, 160, 76, 0.12)" />
      <path d="M0,0 C-14,-32 0,-70 0,-78 C0,-70 14,-32 0,0" transform="rotate(112.5)" fill="rgba(216, 160, 76, 0.12)" />
      <path d="M0,0 C-14,-32 0,-70 0,-78 C0,-70 14,-32 0,0" transform="rotate(157.5)" fill="rgba(216, 160, 76, 0.12)" />
      <path d="M0,0 C-14,-32 0,-70 0,-78 C0,-70 14,-32 0,0" transform="rotate(202.5)" fill="rgba(216, 160, 76, 0.12)" />
      <path d="M0,0 C-14,-32 0,-70 0,-78 C0,-70 14,-32 0,0" transform="rotate(247.5)" fill="rgba(216, 160, 76, 0.12)" />
      <path d="M0,0 C-14,-32 0,-70 0,-78 C0,-70 14,-32 0,0" transform="rotate(292.5)" fill="rgba(216, 160, 76, 0.12)" />
      <path d="M0,0 C-14,-32 0,-70 0,-78 C0,-70 14,-32 0,0" transform="rotate(337.5)" fill="rgba(216, 160, 76, 0.12)" />
    </g>

    <!-- Center Radiant Core with Sacred Om -->
    <circle cx="0" cy="0" r="42" fill="#070e1a" stroke="url(#goldMetallic)" stroke-width="2" />
    <circle cx="0" cy="0" r="36" fill="none" stroke="url(#goldMetallic)" stroke-width="0.8" stroke-dasharray="2,3" />
    <circle cx="0" cy="0" r="28" fill="url(#sunGlow)" opacity="0.4" />
    
    <!-- Sacred Om Calligraphy -->
    <text x="0" y="12" font-family="'Noto Serif Devanagari', 'Cinzel', serif" font-size="32" font-weight="700" fill="url(#goldMetallic)" text-anchor="middle" filter="url(#intenseGlow)">ॐ</text>
  </g>
</svg>
