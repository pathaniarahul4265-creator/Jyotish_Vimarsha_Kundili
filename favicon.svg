<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <radialGradient id="favBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0c1830" />
      <stop offset="60%" stop-color="#070c18" />
      <stop offset="100%" stop-color="#03060c" />
    </radialGradient>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8e6" />
      <stop offset="35%" stop-color="#f5dc9e" />
      <stop offset="70%" stop-color="#dfad52" />
      <stop offset="100%" stop-color="#9a6b16" />
    </linearGradient>
    <linearGradient id="favSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#9bb3c7" />
    </linearGradient>
  </defs>
  <circle cx="64" cy="64" r="62" fill="url(#favBg)" stroke="url(#favGold)" stroke-width="2.5" />
  <circle cx="64" cy="64" r="56" fill="none" stroke="url(#favSilver)" stroke-width="0.8" stroke-dasharray="2,3" opacity="0.8" />
  <circle cx="64" cy="64" r="46" fill="none" stroke="url(#favGold)" stroke-width="1" opacity="0.6" />
  <!-- 12 Star Nodes on rim -->
  <g fill="url(#favGold)">
    <circle cx="64" cy="18" r="2" /><circle cx="87" cy="24" r="1.5" /><circle cx="104" cy="41" r="1.5" />
    <circle cx="110" cy="64" r="2" /><circle cx="104" cy="87" r="1.5" /><circle cx="87" cy="104" r="1.5" />
    <circle cx="64" cy="110" r="2" /><circle cx="41" cy="104" r="1.5" /><circle cx="24" cy="87" r="1.5" />
    <circle cx="18" cy="64" r="2" /><circle cx="24" cy="41" r="1.5" /><circle cx="41" cy="24" r="1.5" />
  </g>
  <!-- 8 Petal Lotus Star Geometry -->
  <g stroke="url(#favGold)" stroke-width="1" fill="rgba(242,215,146,0.08)">
    <polygon points="64,28 72,56 100,64 72,72 64,100 56,72 28,64 56,56" />
    <polygon points="64,32 70,58 96,64 70,70 64,96 58,70 32,64 58,58" transform="rotate(45 64 64)" stroke="url(#favSilver)" stroke-width="0.8" />
  </g>
  <!-- Center Sacred Om -->
  <circle cx="64" cy="64" r="22" fill="#070e1c" stroke="url(#favGold)" stroke-width="1.6" />
  <text x="64" y="74" font-family="'Noto Serif Devanagari', 'Cinzel', serif" font-size="28" font-weight="bold" fill="url(#favGold)" text-anchor="middle">ॐ</text>
</svg>
