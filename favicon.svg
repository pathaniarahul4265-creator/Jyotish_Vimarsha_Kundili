<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#183044"/>
      <stop offset="100%" stop-color="#050b12"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fce8af"/>
      <stop offset="50%" stop-color="#d8a04c"/>
      <stop offset="100%" stop-color="#a2752e"/>
    </linearGradient>
    <linearGradient id="aquaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9ee0dc"/>
      <stop offset="100%" stop-color="#519e99"/>
    </linearGradient>
  </defs>
  <!-- Background disc with gold ring -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGlow)" stroke="url(#goldGrad)" stroke-width="1.5"/>
  
  <!-- Outer zodiac tick ring -->
  <circle cx="32" cy="32" r="26" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" stroke-dasharray="2 3.4" opacity="0.85"/>
  <circle cx="32" cy="32" r="23" fill="none" stroke="#7fc5c0" stroke-width="0.5" opacity="0.6"/>

  <!-- Kundli / Vedic Chart Sacred Diamond -->
  <rect x="18.5" y="18.5" width="27" height="27" rx="1.5" fill="none" stroke="url(#goldGrad)" stroke-width="1.2"/>
  <path d="M32 18.5 L45.5 32 L32 45.5 L18.5 32 Z" fill="none" stroke="url(#aquaGrad)" stroke-width="1" opacity="0.9"/>
  <path d="M18.5 18.5 L45.5 45.5 M45.5 18.5 L18.5 45.5" stroke="url(#goldGrad)" stroke-width="0.7" opacity="0.5"/>

  <!-- Central Celestial Bindu & Star Rays -->
  <path d="M32 21 V43 M21 32 H43" stroke="url(#goldGrad)" stroke-width="0.9" opacity="0.75"/>
  <circle cx="32" cy="32" r="3.5" fill="url(#goldGrad)"/>
  <circle cx="32" cy="32" r="1.5" fill="#ffffff"/>
</svg>
